; ESP32 SimpleClock - Waveshare ESP32-C6-Touch-AMOLED-2.16
;
; Every version is pinned. pioarduino 55.03.38-1 = Arduino-ESP32 3.3.8 on
; ESP-IDF 5.5.4, tested on this board.

[platformio]
default_envs = clock

[env:clock]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino

; The board has 16 MB flash; the default 1.25 MB app partition is too small.
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

upload_speed = 921600
monitor_speed = 115200
monitor_filters = direct

build_flags =
    ; The C6 only has USB-Serial-JTAG: both flags are needed for Serial over USB.
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DXPOWERS_CHIP_AXP2101
    -Wall

; Turns an optional .env into a Wi-Fi defaults header inside the build
; directory, so credentials never land in the sources.
extra_scripts = pre:scripts/pio_env.py

lib_deps =
    moononournation/GFX Library for Arduino@1.6.6
    lewisxhe/SensorLib@0.2.6
    lewisxhe/XPowersLib@0.2.9
